<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 412pt body with room for the shadow -->
  <rect x="50" y="42" width="412" height="412" rx="94" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="50.75" y="42.75" width="410.5" height="410.5" rx="93.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <ellipse cx="256" cy="232" rx="190" ry="70" fill="url(#glow)"/>

  <rect x="130" y="146" width="148" height="30" rx="15" fill="#f8fafc" opacity="0.92"/>
  <rect x="130" y="206" width="252" height="30" rx="15" fill="url(#green)"/>
  <rect x="130" y="266" width="100" height="30" rx="15" fill="#ffffff" opacity="0.38"/>
  <rect x="130" y="326" width="184" height="30" rx="15" fill="#ffffff" opacity="0.16"/>
</svg>
