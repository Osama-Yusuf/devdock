<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DevDock - Port History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="titlebar"></div>
  <div class="card">
    <div class="inner">
      <div class="card-header">
        <div class="logo-area">
          <a href="/" class="btn-icon" title="Back to dashboard (D)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
          <div class="stats-left">
            <div class="stat"><span class="stat-value">History</span></div>
            <div class="stat"><span class="stat-value small" id="runningCount">0</span><span class="stat-label">running</span></div>
            <div class="stat"><span class="stat-value small muted" id="stoppedCount">0</span><span class="stat-label">stopped</span></div>
          </div>
        </div>
        <div class="header-actions">
          <button class="clear-history-btn" id="clearAllBtn" title="Forget every stopped port">Clear history</button>
        </div>
      </div>

      <div class="search-filter-row">
        <div class="search-box">
          <span class="search-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" class="search-input" id="searchInput" placeholder="Search ports, processes, paths... ( / )" />
        </div>
        <div class="seg" id="statusSeg" title="Filter by status">
          <button data-s="all">All</button>
          <button data-s="running">Running</button>
          <button data-s="stopped">Stopped</button>
        </div>
        <div class="seg" id="groupSeg" title="Group rows (G)">
          <button data-g="none">Flat</button>
          <button data-g="project">Project</button>
        </div>
        <div class="filter-group">
          <select class="filter-select" id="runtimeFilter"><option value="all">All Runtimes</option></select>
          <button class="clear-btn" id="clearFilters" style="display:none;">Clear</button>
        </div>
        <div class="result-info" id="resultInfo"></div>
      </div>

      <div class="scroll" id="tableContainer">
        <table class="history-table">
          <thead>
            <tr>
              <th>Port</th>
              <th>PID</th>
              <th>Runtime</th>
              <th>Path</th>
              <th>Last seen</th>
              <th aria-label="Actions"></th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width:50px"></div></td><td><div class="skeleton-bar" style="width:44px"></div></td><td><div class="skeleton-bar" style="width:90px"></div></td><td><div class="skeleton-bar" style="width:220px"></div></td><td><div class="skeleton-bar" style="width:60px"></div></td><td></td></tr>
            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width:50px"></div></td><td><div class="skeleton-bar" style="width:44px"></div></td><td><div class="skeleton-bar" style="width:90px"></div></td><td><div class="skeleton-bar" style="width:180px"></div></td><td><div class="skeleton-bar" style="width:60px"></div></td><td></td></tr>
          </tbody>
        </table>
      </div>

      <div class="empty" id="emptyState" style="display:none;"></div>

      <div class="tips-hint"><kbd>/</kbd> search &nbsp; <kbd>G</kbd> group &nbsp; <kbd>D</kbd> dashboard &nbsp; <kbd>Esc</kbd> clear filters</div>
    </div>
  </div>
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <div class="actions-menu" id="floatingMenu"></div>

  <script src="/js/runtime-icons.js"></script>
  <script src="/js/tooltip.js"></script>
  <script src="/js/confirm.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
